# Yaml file to create workflow for Java CI/CD pipeline
name: Java CI pipeline

# 1. when should run the workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 2. what permissions are required to run the workflow
permissions:
  contents: read
  
# define jobs to run in the workflow
jobs:
  build:
    # 4. Which machine will run this job?
    name: Build and Test
    runs-on: Ubuntu 26

    # 5. What operations should the job perform?
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v5

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      #compile application using Maven
      - name: compile application
        run: mvn -B clean compile

      # Run tests using Maven
      - name: Run Tests
        run: mvn  -B test
